services:
  mysql:
    image: mysql:8.4
    container_name: nutriverde-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${BUSINESS_TIMEZONE:-America/Guatemala}
    # En prod NO publicamos MySQL al host (el Pi corre otros proyectos).
    # El backend se conecta por la red interna del compose: host=mysql, port=3306.
    expose:
      - "3306"
    volumes:
      - nutriverde_mysql_data:/var/lib/mysql
      # OJO: ./docker/initdb NO se monta aquí a propósito. Ese script hace
      # `GRANT ALL PRIVILEGES ON *.*` para la shadow database que Prisma usa
      # en `migrate dev`; en prod solo corremos `migrate deploy`, que no la
      # necesita, y ese permiso daría al usuario de la app control sobre toda
      # la instancia MySQL (incluidas las bases de otros proyectos del host).
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-06:00
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nutriverde-backend:latest
    container_name: nutriverde-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescribimos para que apunte al contenedor mysql por su nombre de servicio
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}"
      NODE_ENV: production
      PORT: 4001
    # No publicamos 4001 al host. El TLS y el ruteo de api.plenhanutrition.com
    # los resuelve el Traefik que Dokploy ya trae; le basta alcanzar el
    # contenedor por la red interna. Publicarlo aquí dejaría la API accesible
    # por HTTP plano, saltándose el proxy.
    #
    # Para que Traefik lo alcance, el servicio debe compartir la red de Dokploy.
    # Si Dokploy no la adjunta solo al desplegar este compose, descomenta:
    #   networks:
    #     - dokploy-network
    # y al final del archivo:
    #   networks:
    #     dokploy-network:
    #       external: true
    expose:
      - "4001"
    volumes:
      - nutriverde_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    # Sin `command:` a propósito. Las migraciones y el arranque viven en el CMD
    # del Dockerfile, que usa `exec` para que tini entregue SIGTERM a node y
    # funcione el apagado ordenado. Un override aquí volvería a romperlo.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:4001/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generoso: el contenedor corre `prisma migrate deploy` antes de escuchar.
      start_period: 60s

volumes:
  nutriverde_mysql_data:
    name: nutriverde_mysql_data
  nutriverde_uploads:
    name: nutriverde_uploads
