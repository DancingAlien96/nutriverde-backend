services:
  mysql:
    image: mysql:8.4
    container_name: nutriverde-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${BUSINESS_TIMEZONE:-America/Guatemala}
    # En prod NO publicamos MySQL al host (el Pi corre otros proyectos).
    # El backend se conecta por la red interna del compose: host=mysql, port=3306.
    expose:
      - "3306"
    volumes:
      - nutriverde_mysql_data:/var/lib/mysql
      # OJO: ./docker/initdb NO se monta aquí a propósito. Ese script hace
      # `GRANT ALL PRIVILEGES ON *.*` para la shadow database que Prisma usa
      # en `migrate dev`; en prod solo corremos `migrate deploy`, que no la
      # necesita, y ese permiso daría al usuario de la app control sobre toda
      # la instancia MySQL (incluidas las bases de otros proyectos del host).
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-06:00
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nutriverde-backend:latest
    container_name: nutriverde-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescribimos para que apunte al contenedor mysql por su nombre de servicio
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}"
      NODE_ENV: production
      PORT: 4001
    # No publicamos 4001 al host: el único camino de entrada es Caddy, que
    # termina el TLS. Publicarlo aquí dejaría la API accesible por HTTP plano.
    expose:
      - "4001"
    volumes:
      - nutriverde_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    # Sin `command:` a propósito. Las migraciones y el arranque viven en el CMD
    # del Dockerfile, que usa `exec` para que tini entregue SIGTERM a node y
    # funcione el apagado ordenado. Un override aquí volvería a romperlo.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:4001/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generoso: el contenedor corre `prisma migrate deploy` antes de escuchar.
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: nutriverde-caddy
    restart: unless-stopped
    # Caddy saca y renueva el certificado de Let's Encrypt solo. Requiere que
    # api.plenhanutrition.com apunte por DNS a la IP pública de este host y que
    # los puertos 80 y 443 estén abiertos hacia él.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados — NO borrar este volumen
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  nutriverde_mysql_data:
    name: nutriverde_mysql_data
  nutriverde_uploads:
    name: nutriverde_uploads
  caddy_data:
    name: nutriverde_caddy_data
  caddy_config:
    name: nutriverde_caddy_config
